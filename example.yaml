video: sample.mp4
output: rendered.mp4

canvas:
  width: 360
  height: 640
  fit: letterbox_blur

defaults:
  position: { x: center, y: 0.45 }
  fade_in: 0.2
  fade_out: 0.2
  style:
    font: Arial
    size: 28
    color: "#ffffff"
    outline:
      color: "#000000"
      width: 2

overlays:
  - text: "A happy accident!"
    start: 0.25
    end: 1.5
  - text: "Nice tempo shift"
    start: 1.0
    end: 1.9
    style:
      color: "#22c55e"